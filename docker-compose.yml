services:
  app:
    build: .
    container_name: epay-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./:/var/www/epay
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ssl_certs:/etc/nginx/ssl
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-epay}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME:-epay}
      - DB_PREFIX=${DB_PREFIX:-pay}
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - epay-net

  db:
    image: mysql:8.0
    container_name: epay-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_DATABASE=${DB_NAME:-epay}
      - MYSQL_USER=${DB_USER:-epay}
      - MYSQL_PASSWORD=${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - epay-net

volumes:
  db_data:
  ssl_certs:

networks:
  epay-net:
    driver: bridge
